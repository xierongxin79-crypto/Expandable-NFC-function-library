<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLY HORSE TALISMAN</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* 稍微提亮一点背景 */
            font-family: -apple-system, BlinkMacSystemFont, serif;
        }

        .back-link {
            position: absolute;
            top: 24px; left: 24px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.6);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .hint-text {
            position: absolute;
            bottom: 12%;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <a href="index.html" class="back-link">← HUB</a>
    <div class="hint-text" id="hint">TOUCH TO HEAL</div>
    <audio id="audio" src="holyhorse.mp3"></audio>

    <script>
        // --- 1. 场景初始化 ---
        const scene = new THREE.Scene();
        // 降低雾的密度，让环境亮一点
        scene.fog = new THREE.FogExp2(0x050505, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 16); // 稍微抬高相机视角
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // 开启阴影支持
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 2. 增强灯光系统 ---
        
        // 环境光：大幅提亮 (从 1.5 -> 2.5)
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5); 
        scene.add(ambientLight);

        // 主顶光 (产生阴影)
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainLight.position.set(2, 10, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // 底座发光 (模拟展示台灯光)
        const standLight = new THREE.PointLight(0x4488ff, 2, 20);
        standLight.position.set(0, -4, 2);
        scene.add(standLight);

        // 扫光灯 (动画用)
        const flashLight = new THREE.PointLight(0xffffff, 0, 20);
        scene.add(flashLight);

        // --- 3. 创建展示台 (Podium) ---
        const standGeo = new THREE.CylinderGeometry(5, 6, 1, 64);
        const standMat = new THREE.MeshStandardMaterial({
            color: 0x111111,
            roughness: 0.2,
            metalness: 0.8,
            emissive: 0x001133,
            emissiveIntensity: 0.5
        });
        const stand = new THREE.Mesh(standGeo, standMat);
        stand.position.y = -5.5; // 放在符咒下方
        stand.receiveShadow = true;
        scene.add(stand);

        // 展示台的光环
        const ringGeo = new THREE.TorusGeometry(5.2, 0.1, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x0088ff });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -5.0;
        scene.add(ring);

        // --- 4. 创建符咒模型 ---
        
        // 4.1 调整八边形尺寸 (缩小一点以适配图片)
        const shape = new THREE.Shape();
        const r = 3.6; // 原来是4.0，改小一点
        for (let i = 0; i < 8; i++) {
            const angle = (i * 45 + 22.5) * Math.PI / 180;
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
        }

        const extrudeSettings = { depth: 0.5, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.2, bevelSegments: 2 };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();

        const stoneMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x666666, roughness: 0.6, metalness: 0.2 
        });

        const talismanMesh = new THREE.Mesh(geometry, stoneMaterial);
        talismanMesh.castShadow = true;
        scene.add(talismanMesh);
        
        // 初始状态：背面
        talismanMesh.rotation.y = Math.PI; 
        talismanMesh.rotation.x = 0.1;

        // --- 5. 贴图处理 (白底变透明的关键) ---
        const textureLoader = new THREE.TextureLoader();
        // 稍微放大一点贴图平面，覆盖整个八卦面
        const planeGeo = new THREE.PlaneGeometry(5.2, 5.2); 

        // 5.1 正面马
        textureLoader.load('talisman_front.jpg', (tex) => {
            const frontMat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                // 【核心代码】MultiplyBlending (正片叠底)
                // 白色背景 x 任何颜色 = 透明/无变化
                // 黑色图案 x 颜色 = 黑色
                blending: THREE.MultiplyBlending, 
                color: 0xaa99ff, // 将黑色染成微紫 (Multiply模式下只能染暗部)
                side: THREE.FrontSide
            });
            const frontMesh = new THREE.Mesh(planeGeo, frontMat);
            frontMesh.position.z = 0.46; // 紧贴石面
            talismanMesh.add(frontMesh);
        });

        // 5.2 背面符文
        textureLoader.load('talisman_back.jpg', (tex) => {
            const backMat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                // 【核心代码】同理，去白底
                blending: THREE.MultiplyBlending,
                color: 0xaaaaaa, // 保持深灰
                side: THREE.FrontSide
            });
            const backMesh = new THREE.Mesh(planeGeo, backMat);
            backMesh.rotation.y = Math.PI;
            backMesh.position.z = -0.46;
            talismanMesh.add(backMesh);
        });

        // --- 6. 动画逻辑 ---
        let isCasting = false;
        const audio = document.getElementById("audio");
        const hint = document.getElementById("hint");

        window.addEventListener('click', () => {
            if (isCasting) return;
            isCasting = true;
            hint.style.opacity = 0;
            audio.currentTime = 0;
            audio.play();

            // 每次点击都强制重置到背面
            talismanMesh.rotation.y = Math.PI; 
            flashLight.intensity = 0;

            // 1. 背面扫光
            flashLight.position.set(-6, 6, -4); 
            new TWEEN.Tween(flashLight).to({ intensity: 3 }, 200).start();
            new TWEEN.Tween(flashLight.position).to({ x: 6, y: -6 }, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(() => { flashLight.intensity = 0; })
                .start();

            // 2. 翻转 (1.2s - 3.2s)
            new TWEEN.Tween(talismanMesh.rotation)
                .to({ y: 0 }, 2000)
                .delay(1200)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            // 3. 正面扫光 (3.2s - 4.2s)
            setTimeout(() => {
                flashLight.position.set(-6, -6, 4); 
                flashLight.intensity = 0;
                new TWEEN.Tween(flashLight).to({ intensity: 4 }, 200).start();
                new TWEEN.Tween(flashLight.position).to({ x: 6, y: 6 }, 1000)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .onComplete(() => {
                        flashLight.intensity = 0;
                        setTimeout(() => {
                            isCasting = false;
                            hint.style.opacity = 1;
                        }, 500);
                    })
                    .start();
            }, 3200);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            if (!isCasting) {
                // 待机浮动
                talismanMesh.position.y = Math.sin(time * 0.001) * 0.2;
                // 底座呼吸灯
                standLight.intensity = 2 + Math.sin(time * 0.002) * 0.5;
            }
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
