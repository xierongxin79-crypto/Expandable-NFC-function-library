<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLY HORSE TALISMAN</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000; /* 纯黑背景 */
            font-family: -apple-system, BlinkMacSystemFont, serif;
        }

        .back-link {
            position: absolute;
            top: 24px; left: 24px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .hint-text {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <a href="index.html" class="back-link">← HUB</a>
    <div id="loader">GENERATING 3D GEOMETRY...</div>
    <div class="hint-text" id="hint">TOUCH TO HEAL</div>
    <audio id="audio" src="holyhorse.mp3"></audio>

    <script>
        // --- 1. 场景初始化 ---
        const scene = new THREE.Scene();
        // 极淡的雾，增加空间感
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 16; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. 灯光系统 (只保留展示必要的灯光) ---
        
        // 环境光：足够亮以看清黑色的符文
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9); 
        scene.add(ambientLight);

        // 主光：硬光，产生立体投影
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 5, 10);
        scene.add(mainLight);

        // 侧光：勾勒石头边缘
        const rimLight = new THREE.DirectionalLight(0x4455ff, 0.4);
        rimLight.position.set(-5, 0, -5);
        scene.add(rimLight);

        // 特效扫光灯
        const flashLight = new THREE.PointLight(0xffffff, 0, 15);
        scene.add(flashLight);

        // --- 3. 核心算法：图片转 3D 体积 (Layer Stacking) ---
        // 这个函数读取图片像素，生成一个只包含图案的“遮罩”，并堆叠多层产生厚度
        function createVolumetricModel(imageUrl, colorHex, layers = 10, depth = 0.2) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = imageUrl;
                
                img.onload = () => {
                    // 1. 像素处理：生成高对比度蒙版
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 512, 512);
                    
                    const imageData = ctx.getImageData(0, 0, 512, 512);
                    const data = imageData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        const avg = (data[i] + data[i+1] + data[i+2]) / 3;
                        // 阈值处理：接近白色的背景设为完全透明
                        if (avg > 180) { 
                            data[i+3] = 0; 
                        } else {
                            // 图案部分设为不透明，且填充纯白(用于着色)
                            data[i] = 255; 
                            data[i+1] = 255; 
                            data[i+2] = 255;
                            data[i+3] = 255;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    
                    // 生成纹理
                    const texture = new THREE.CanvasTexture(canvas);
                    // 关键：不使用Mipmap，保证边缘锐利像切割的一样
                    texture.minFilter = THREE.LinearFilter; 
                    texture.magFilter = THREE.LinearFilter;

                    // 2. 创建体积层 (Stacking)
                    const group = new THREE.Group();
                    const planeGeo = new THREE.PlaneGeometry(5.0, 5.0);
                    const layerSpacing = depth / layers;

                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true,
                        color: new THREE.Color(colorHex),
                        alphaTest: 0.5, // 关键：丢弃半透明像素，产生硬边切割效果
                        side: THREE.DoubleSide
                    });

                    // 循环生成层，堆叠起来形成厚度
                    for (let i = 0; i < layers; i++) {
                        const layer = new THREE.Mesh(planeGeo, material);
                        layer.position.z = i * layerSpacing;
                        group.add(layer);
                    }

                    resolve(group);
                };
                img.onerror = () => resolve(null);
            });
        }

        // --- 4. 符咒基座 (严格尺寸) ---
        
        // 按照要求：图片宽度 5.0，作为正八边形对边距离
        // 计算半径 r = (5.0 / 2) / cos(22.5deg) ≈ 2.706
        const r = 2.71; 
        const shape = new THREE.Shape();
        for (let i = 0; i < 8; i++) {
            const angle = (i * 45 + 22.5) * Math.PI / 180;
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
        }

        const extrudeSettings = { 
            depth: 0.5, 
            bevelEnabled: true, 
            bevelThickness: 0.1, // 锐利的倒角
            bevelSize: 0.1, 
            bevelSegments: 1 
        };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();

        // 材质：深岩石灰
        const stoneMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333, 
            roughness: 0.9, 
            metalness: 0.1 
        });

        const talismanMesh = new THREE.Mesh(geometry, stoneMaterial);
        scene.add(talismanMesh);
        
        // 初始位置：背面朝外
        talismanMesh.rotation.y = Math.PI; 
        talismanMesh.rotation.x = 0.1;

        // --- 5. 生成 3D 图案 ---
        
        Promise.all([
            // 正面马：淡紫色 (#dda0dd)，厚度 0.15
            createVolumetricModel('talisman_front.jpg', '#dda0dd', 10, 0.15),
            // 背面符文：黑色 (#111111)，厚度 0.15
            createVolumetricModel('talisman_back.jpg', '#111111', 10, 0.15)
        ]).then(models => {
            const [horseModel, runeModel] = models;

            // 5.1 安置正面马 (3D拉伸)
            if (horseModel) {
                // 放置在石头表面 (z=0.25是石头表面)
                horseModel.position.z = 0.25; 
                talismanMesh.add(horseModel);
                
                // 增加一点微弱的发光核心
                const glow = new THREE.PointLight(0xdda0dd, 0.5, 2);
                glow.position.z = 0.5;
                talismanMesh.add(glow);
            }

            // 5.2 安置背面符文 (3D拉伸)
            if (runeModel) {
                // 背面需要旋转并反向放置
                runeModel.rotation.y = Math.PI; 
                // 注意：因为是Group堆叠，原点在底层，所以要往里推一点或者反向堆叠
                // 简单处理：Z轴负方向放置
                runeModel.position.z = -0.25; 
                // 修正：因为旋转了180度，它的正Z是朝里的，所以没问题
                talismanMesh.add(runeModel);
            }

            document.getElementById('loader').style.display = 'none';
        });

        // --- 6. 动画逻辑 ---
        let isCasting = false;
        const audio = document.getElementById("audio");
        const hint = document.getElementById("hint");

        window.addEventListener('click', () => {
            if (isCasting) return;
            isCasting = true;
            hint.style.opacity = 0;
            audio.currentTime = 0;
            audio.play();

            // 重置
            talismanMesh.rotation.y = Math.PI; 
            flashLight.intensity = 0;

            // 1. 背面一闪而过 (扫光)
            flashLight.position.set(-6, 6, -4); 
            new TWEEN.Tween(flashLight).to({ intensity: 3 }, 200).start();
            new TWEEN.Tween(flashLight.position).to({ x: 6, y: -6 }, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(() => { flashLight.intensity = 0; })
                .start();

            // 2. 翻转 (1.2s - 3.2s)
            new TWEEN.Tween(talismanMesh.rotation)
                .to({ y: 0 }, 2000)
                .delay(1200)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            // 3. 正面一闪而过
            setTimeout(() => {
                flashLight.position.set(-6, -6, 4); 
                flashLight.intensity = 0;
                new TWEEN.Tween(flashLight).to({ intensity: 4 }, 200).start();
                new TWEEN.Tween(flashLight.position).to({ x: 6, y: 6 }, 1000)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .onComplete(() => {
                        flashLight.intensity = 0;
                        setTimeout(() => {
                            isCasting = false;
                            hint.style.opacity = 1;
                        }, 500);
                    })
                    .start();
            }, 3200);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            if (!isCasting) {
                talismanMesh.position.y = Math.sin(time * 0.001) * 0.15;
            }
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
