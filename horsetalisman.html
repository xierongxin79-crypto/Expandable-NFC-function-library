<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLY HORSE TALISMAN</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000; /* 纯黑背景 */
            font-family: -apple-system, BlinkMacSystemFont, serif;
        }

        .back-link {
            position: absolute;
            top: 24px; left: 24px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .hint-text {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #444;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <a href="index.html" class="back-link">← HUB</a>
    <div id="loader">PROCESSING...</div>
    <div class="hint-text" id="hint">TOUCH TO HEAL</div>
    <audio id="audio" src="holyhorse.mp3"></audio>

    <script>
        // --- 1. 场景初始化 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 16; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. 严格控制的灯光 (恢复深色质感) ---
        
        // 环境光：调低，保证暗部是黑灰色的，而不是白的
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        // 主光源：侧上方打光，照亮石头纹理
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 5, 10);
        scene.add(mainLight);

        // 轮廓光：微弱的蓝光，勾勒边缘
        const rimLight = new THREE.DirectionalLight(0x4455ff, 0.5);
        rimLight.position.set(-5, 0, -5);
        scene.add(rimLight);

        // 扫光灯 (特效用)
        const flashLight = new THREE.PointLight(0xffffff, 0, 15);
        scene.add(flashLight);

        // --- 3. 图像处理核心函数 (解决白底和改色问题) ---
        function processTexture(imageUrl, type) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = imageUrl;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 512, 512);
                    
                    const imageData = ctx.getImageData(0, 0, 512, 512);
                    const data = imageData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];
                        const brightness = (r + g + b) / 3;

                        // 1. 去除背景 (如果像素接近白色，Alpha设为0)
                        if (brightness > 200) { 
                            data[i+3] = 0; // 完全透明
                        } else {
                            // 2. 针对图案内颜色的修改
                            if (type === 'front') {
                                // 正面：把原本的颜色(不管红黑) 强制改成 淡紫色 (#dda0dd)
                                data[i] = 221;   // R
                                data[i+1] = 160; // G
                                data[i+2] = 221; // B
                                // Alpha 保持 255
                            } else if (type === 'back') {
                                // 背面：强制改成 黑色
                                data[i] = 20;
                                data[i+1] = 20;
                                data[i+2] = 20;
                            }
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    const texture = new THREE.CanvasTexture(canvas);
                    resolve(texture);
                };
                img.onerror = () => {
                    console.error("图片加载失败");
                    resolve(null);
                }
            });
        }

        // --- 4. 符咒建模 (严格尺寸适配) ---
        
        // 设定图片平面的宽度
        const IMG_WIDTH = 5.0; 
        
        // 计算正八边形的半径 (Center to Vertex)
        // 几何公式：对边距离(Apothem * 2) = IMG_WIDTH
        // Apothem = IMG_WIDTH / 2 = 2.5
        // Radius = Apothem / cos(22.5度)
        // Radius = 2.5 / 0.92388 ≈ 2.706
        const r = 2.71; 

        const shape = new THREE.Shape();
        for (let i = 0; i < 8; i++) {
            const angle = (i * 45 + 22.5) * Math.PI / 180;
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
        }

        const extrudeSettings = { 
            depth: 0.5, 
            bevelEnabled: true, 
            bevelThickness: 0.15, // 稍微减小倒角，让边缘更锐利
            bevelSize: 0.15, 
            bevelSegments: 2 
        };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();

        // 材质：深灰色岩石 (不带颜色倾向)
        const stoneMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333, // 深灰
            roughness: 0.8,  // 粗糙
            metalness: 0.1   // 低金属感
        });

        const talismanMesh = new THREE.Mesh(geometry, stoneMaterial);
        scene.add(talismanMesh);
        
        // 初始状态：背面
        talismanMesh.rotation.y = Math.PI; 
        talismanMesh.rotation.x = 0.1; // 微倾斜

        // --- 5. 加载并应用图案 ---
        
        Promise.all([
            processTexture('talisman_front.jpg', 'front'),
            processTexture('talisman_back.jpg', 'back')
        ]).then(textures => {
            const [frontTex, backTex] = textures;
            const planeGeo = new THREE.PlaneGeometry(IMG_WIDTH, IMG_WIDTH);

            // 5.1 正面 (马)
            if (frontTex) {
                const frontMat = new THREE.MeshBasicMaterial({
                    map: frontTex,
                    transparent: true, // 开启透明
                    side: THREE.FrontSide
                });
                const frontMesh = new THREE.Mesh(planeGeo, frontMat);
                frontMesh.position.z = 0.26; // 稍微浮起一点点
                talismanMesh.add(frontMesh);

                // 添加微弱的发光层 (只给马)
                const glowMesh = frontMesh.clone();
                glowMesh.material = glowMesh.material.clone();
                glowMesh.material.blending = THREE.AdditiveBlending;
                glowMesh.material.opacity = 0.3;
                glowMesh.position.z = 0.27;
                talismanMesh.add(glowMesh);
            }

            // 5.2 背面 (符文)
            if (backTex) {
                const backMat = new THREE.MeshBasicMaterial({
                    map: backTex,
                    transparent: true,
                    side: THREE.FrontSide
                });
                const backMesh = new THREE.Mesh(planeGeo, backMat);
                backMesh.rotation.y = Math.PI;
                backMesh.position.z = -0.26;
                talismanMesh.add(backMesh);
            }

            document.getElementById('loader').style.display = 'none';
        });

        // --- 6. 动画逻辑 ---
        let isCasting = false;
        const audio = document.getElementById("audio");
        const hint = document.getElementById("hint");

        window.addEventListener('click', () => {
            if (isCasting) return;
            isCasting = true;
            hint.style.opacity = 0;
            audio.currentTime = 0;
            audio.play();

            // 重置
            talismanMesh.rotation.y = Math.PI; 
            flashLight.intensity = 0;

            // 1. 背面扫光
            flashLight.position.set(-6, 6, -4); 
            new TWEEN.Tween(flashLight).to({ intensity: 3 }, 200).start();
            new TWEEN.Tween(flashLight.position).to({ x: 6, y: -6 }, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(() => { flashLight.intensity = 0; })
                .start();

            // 2. 翻转
            new TWEEN.Tween(talismanMesh.rotation)
                .to({ y: 0 }, 2000)
                .delay(1200)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            // 3. 正面扫光
            setTimeout(() => {
                flashLight.position.set(-6, -6, 4); 
                flashLight.intensity = 0;
                new TWEEN.Tween(flashLight).to({ intensity: 4 }, 200).start();
                new TWEEN.Tween(flashLight.position).to({ x: 6, y: 6 }, 1000)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .onComplete(() => {
                        flashLight.intensity = 0;
                        setTimeout(() => {
                            isCasting = false;
                            hint.style.opacity = 1;
                        }, 500);
                    })
                    .start();
            }, 3200);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            if (!isCasting) {
                // 待机微动
                talismanMesh.position.y = Math.sin(time * 0.001) * 0.15;
            }
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
