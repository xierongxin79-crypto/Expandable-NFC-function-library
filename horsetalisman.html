<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLY HORSE TALISMAN</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000; /* 纯黑背景 */
            font-family: -apple-system, BlinkMacSystemFont, serif;
        }

        .back-link {
            position: absolute;
            top: 24px; left: 24px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .back-link:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .hint-text {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #444;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <a href="index.html" class="back-link">← HUB</a>
    <div id="loader">CARVING STONE...</div>
    <div class="hint-text" id="hint">TOUCH TO HEAL</div>
    
    <audio id="audio" src="holyhorse.mp3"></audio>

    <script>
        // --- 1. 场景与渲染器 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- 2. 灯光系统 ---
        // 环境光：微弱
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); 
        scene.add(ambientLight);

        // 主光源：顶部冷白光
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(0, 10, 5);
        scene.add(mainLight);

        // 扫光灯 (Flash Light) - 用于一闪而过的效果
        // 我们创建一个聚光灯，默认关闭，动画时移动它
        const flashLight = new THREE.PointLight(0xffffff, 0, 10); // 强度初始为0
        flashLight.position.set(0, 0, 2);
        scene.add(flashLight);

        // --- 3. 图像处理 (自动扣除背景) ---
        function processTexture(imageUrl, targetColorHex) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = imageUrl;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; 
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.drawImage(img, 0, 0, 512, 512);
                    const imageData = ctx.getImageData(0, 0, 512, 512);
                    const data = imageData.data;
                    
                    const targetColor = new THREE.Color(targetColorHex);
                    const r = targetColor.r * 255;
                    const g = targetColor.g * 255;
                    const b = targetColor.b * 255;

                    for (let i = 0; i < data.length; i += 4) {
                        const red = data[i];
                        const green = data[i + 1];
                        const blue = data[i + 2];
                        const brightness = (red + green + blue) / 3;

                        // 简单的抠图逻辑：
                        // 如果像素比较亮（接近白色背景），设为透明
                        // 如果像素比较暗（图案），设为目标颜色
                        if (brightness > 200) { 
                            data[i + 3] = 0; // 透明
                        } else {
                            data[i] = r;
                            data[i + 1] = g;
                            data[i + 2] = b;
                            data[i + 3] = 255; // 不透明
                        }
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                    const texture = new THREE.CanvasTexture(canvas);
                    texture.needsUpdate = true;
                    resolve(texture);
                };
                img.onerror = () => {
                    console.log("图片加载失败，请检查文件名: " + imageUrl);
                    resolve(null);
                }
            });
        }

        // --- 4. 符咒建模 ---
        
        // 4.1 几何体
        const shape = new THREE.Shape();
        const r = 4.0; 
        for (let i = 0; i < 8; i++) {
            const angle = (i * 45 + 22.5) * Math.PI / 180;
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
        }

        const extrudeSettings = {
            depth: 0.6, 
            bevelEnabled: true, 
            bevelThickness: 0.2, 
            bevelSize: 0.2, 
            bevelSegments: 2 
        };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();

        // 4.2 石头材质 (纯灰色)
        const stoneMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x666666, 
            roughness: 0.8,
            metalness: 0.2
        });

        const talismanMesh = new THREE.Mesh(geometry, stoneMaterial);
        scene.add(talismanMesh);
        
        // 初始状态：显示背面 (符文)
        talismanMesh.rotation.y = Math.PI; 
        talismanMesh.rotation.x = 0.2; // 稍微仰视

        // --- 5. 加载图案 ---
        Promise.all([
            // 正面马：淡紫色 (#dda0dd)
            processTexture('talisman_front.jpg', '#dda0dd'), 
            // 背面符文：黑色 (#111111)
            processTexture('talisman_back.jpg', '#111111') 
        ]).then(textures => {
            const [frontTex, backTex] = textures;
            const planeGeo = new THREE.PlaneGeometry(5.2, 5.2);

            // 1. 正面 (马)
            if (frontTex) {
                const frontPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({
                    map: frontTex,
                    transparent: true,
                    opacity: 0.9,
                    side: THREE.FrontSide // 只显示正面
                }));
                // 关键修正：增加 Z 轴偏移量，防止陷进石头
                frontPlane.position.z = 0.4; 
                talismanMesh.add(frontPlane);
            }

            // 2. 背面 (符文)
            if (backTex) {
                const backPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({
                    map: backTex,
                    transparent: true,
                    opacity: 0.9,
                    side: THREE.FrontSide
                }));
                // 背面图案需要旋转180度并贴在背面
                backPlane.rotation.y = Math.PI;
                backPlane.position.z = -0.4;
                talismanMesh.add(backPlane);
            }

            document.getElementById('loader').style.display = 'none';
        });

        // --- 6. 动画逻辑 ---
        let isCasting = false;
        const audio = document.getElementById("audio");
        const hint = document.getElementById("hint");

        window.addEventListener('click', () => {
            if (isCasting) return;
            isCasting = true;
            hint.style.opacity = 0;
            audio.play();

            // === 动画时间轴 (总长约 5秒) ===
            
            // 0. 准备：灯光复位
            flashLight.intensity = 0;

            // 1. 背面扫光 (0s - 1.5s)
            // 光源从左下移动到右上
            flashLight.position.set(-5, -5, -3); // 在背面一侧
            flashLight.intensity = 2; // 开启强光
            
            new TWEEN.Tween(flashLight.position)
                .to({ x: 5, y: 5 }, 1200) // 1.2秒扫过
                .easing(TWEEN.Easing.Quadratic.InOut)
                .start();

            new TWEEN.Tween(flashLight)
                .to({ intensity: 0 }, 1500) // 扫完后熄灭
                .delay(200)
                .start();

            // 2. 翻转 (1.5s - 3.5s)
            // 从 PI 转到 0
            new TWEEN.Tween(talismanMesh.rotation)
                .to({ y: 0 }, 2000) // 2秒慢转
                .delay(1300) // 等扫光差不多了再转
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            // 3. 正面扫光 (3.5s - 4.5s)
            // 光源移到正面左下
            setTimeout(() => {
                flashLight.position.set(-5, -5, 3); // 正面
                flashLight.intensity = 3; // 更亮一点
                
                new TWEEN.Tween(flashLight.position)
                    .to({ x: 5, y: 5 }, 1000) // 1秒快速扫过
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .start();
                
                new TWEEN.Tween(flashLight)
                    .to({ intensity: 0 }, 1200)
                    .start();
            }, 3300);

            // 4. 结束重置 (5s)
            setTimeout(() => {
                hint.innerText = "HEALED";
                hint.style.opacity = 1;
                isCasting = false;
                // 复位角度 (可选，如果想让它停在正面就不加这行)
                // talismanMesh.rotation.y = Math.PI; 
            }, 5000);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            if (!isCasting) {
                // 待机悬浮
                talismanMesh.position.y = Math.sin(time * 0.001) * 0.2;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
