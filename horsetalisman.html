<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLY HORSE TALISMAN</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, serif;
        }

        .back-link {
            position: absolute;
            top: 24px; left: 24px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .hint-text {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <a href="index.html" class="back-link">← HUB</a>
    <div class="hint-text" id="hint">TOUCH TO HEAL</div>
    <audio id="audio" src="holyhorse.mp3"></audio>

    <script>
        // --- 1. 场景初始化 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. 灯光与氛围 ---
        // 增加蓝色背景光，营造神圣感
        const bgLight = new THREE.PointLight(0x0033ff, 1, 50); 
        bgLight.position.set(0, 0, -10);
        scene.add(bgLight);

        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); 
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 10, 5);
        scene.add(mainLight);

        // 扫光灯 (用于一闪而过特效)
        const flashLight = new THREE.PointLight(0xffffff, 0, 15);
        scene.add(flashLight);

        // --- 3. 创建符咒模型 ---
        
        // 3.1 石头底座
        const shape = new THREE.Shape();
        const r = 4.0; 
        for (let i = 0; i < 8; i++) {
            const angle = (i * 45 + 22.5) * Math.PI / 180;
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
        }

        const extrudeSettings = { depth: 0.6, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.2, bevelSegments: 2 };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();

        const stoneMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x555555, roughness: 0.7, metalness: 0.3 
        });

        const talismanMesh = new THREE.Mesh(geometry, stoneMaterial);
        scene.add(talismanMesh);
        
        // 初始状态：显示背面 (符文)
        talismanMesh.rotation.y = Math.PI; 
        talismanMesh.rotation.x = 0.2;

        // --- 4. 稳健的图案贴图 (直接加载，不抠图) ---
        const textureLoader = new THREE.TextureLoader();
        const planeGeo = new THREE.PlaneGeometry(5.0, 5.0); // 稍微调小一点，保证在石头内

        // 4.1 正面马 (淡紫色光效)
        textureLoader.load('talisman_front.jpg', (tex) => {
            const mat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                color: 0xaa88ff, // 强制染成淡紫色
                blending: THREE.MultiplyBlending, // 变暗混合：白底会变透明，黑图案保留
                side: THREE.FrontSide
            });
            // 如果你的图是红马白底，Multiply 会让红马显现，白底透明。
            // 为了发光效果，我们再叠一层
            
            // 简单方案：使用 AdditiveBlending (发光叠加)，白底变亮，黑图案不显示？不对。
            // 既然你无法保证自动抠图，我们用最基础的 Multiply (正片叠底) 去白底
            // 但正片叠底无法做发光色。
            
            // 修正策略：直接贴图，手动调整Z轴防止闪烁
            // 假设你的图是白底红马/黑字。
            
            const frontPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                color: 0xdda0dd, // 淡紫色滤镜
                // 使用这种混合模式去白底：
                blending: THREE.CustomBlending,
                blendEquation: THREE.AddEquation,
                blendSrc: THREE.DstColorFactor,
                blendDst: THREE.ZeroFactor
                // 这有点复杂，回退到最简单的 Multiply
            }));
            
            // 最终方案：直接用 MultiplyBlending 去白底，虽然不能发光，但能看清
            // 或者：请确保你的图片本身就是 PNG 透明底！(这是最佳方案)
            // 如果必须用 JPG 白底：
            
            const frontMat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                blending: THREE.MultiplyBlending, // 白底变透
                color: 0xffccff // 稍微偏紫
            });

            const frontMesh = new THREE.Mesh(planeGeo, frontMat);
            frontMesh.position.z = 0.51; // 足够突出，防止被遮挡
            talismanMesh.add(frontMesh);
        });

        // 4.2 背面符文 (黑色)
        textureLoader.load('talisman_back.jpg', (tex) => {
            const backMat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                blending: THREE.MultiplyBlending, // 白底变透
                color: 0x888888 // 深灰色
            });
            const backMesh = new THREE.Mesh(planeGeo, backMat);
            backMesh.rotation.y = Math.PI;
            backMesh.position.z = -0.51; // 足够突出
            talismanMesh.add(backMesh);
        });

        // --- 5. 动画逻辑 ---
        let isCasting = false;
        const audio = document.getElementById("audio");
        const hint = document.getElementById("hint");

        window.addEventListener('click', () => {
            if (isCasting) return;
            isCasting = true;
            hint.style.opacity = 0;
            audio.currentTime = 0;
            audio.play();

            // 重置状态
            talismanMesh.rotation.y = Math.PI; 
            flashLight.intensity = 0;

            // === 动画时间轴 ===

            // 1. 背面扫光 (0s - 1.2s)
            flashLight.position.set(-6, 6, -4); // 背面左上
            new TWEEN.Tween(flashLight)
                .to({ intensity: 3 }, 200)
                .start();
            
            new TWEEN.Tween(flashLight.position)
                .to({ x: 6, y: -6 }, 1000) // 扫到右下
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(() => { flashLight.intensity = 0; })
                .start();

            // 2. 翻转 (1.2s - 3.2s)
            new TWEEN.Tween(talismanMesh.rotation)
                .to({ y: 0 }, 2000) // 转到正面
                .delay(1200)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            // 3. 正面扫光 (3.2s - 4.2s)
            setTimeout(() => {
                flashLight.position.set(-6, -6, 4); // 正面左下
                flashLight.intensity = 0;
                
                new TWEEN.Tween(flashLight)
                    .to({ intensity: 4 }, 200) // 亮起
                    .start();

                new TWEEN.Tween(flashLight.position)
                    .to({ x: 6, y: 6 }, 1000) // 扫到右上
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .onComplete(() => {
                        flashLight.intensity = 0;
                        // 动画结束
                        setTimeout(() => {
                            isCasting = false;
                            hint.style.opacity = 1;
                            // 不强制复位，保留在正面展示
                        }, 500);
                    })
                    .start();
            }, 3200);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            if (!isCasting) {
                // 待机轻微浮动
                talismanMesh.position.y = Math.sin(time * 0.001) * 0.15;
            }
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
