<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL 3D TALISMAN GENERATION</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000; /* 纯黑背景 */
            font-family: -apple-system, BlinkMacSystemFont, serif;
        }

        .back-link {
            position: absolute;
            top: 24px; left: 24px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .hint-text {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <a href="index.html" class="back-link">← HUB</a>
    <div id="loader">GENERATING 3D GEOMETRY...<br>ANALYZING LINE ART</div>
    <div class="hint-text" id="hint">TOUCH TO HEAL</div>
    <audio id="audio" src="holyhorse.mp3"></audio>

    <script>
        // --- 1. 场景初始化 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 16; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // 开启更真实的物理光照计算
        renderer.physicallyCorrectLights = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. 专业级灯光系统 (为了凸显 3D 凹凸感) ---
        
        // 环境光：提供基础可见度
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); 
        scene.add(ambientLight);

        // 主光源1：顶部硬光，制造深刻阴影
        const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
        topLight.position.set(0, 10, 2);
        scene.add(topLight);

        // 主光源2：侧面强调光，勾勒浮雕边缘
        const sideLight = new THREE.DirectionalLight(0xaaddff, 2.0);
        sideLight.position.set(5, 2, 5);
        scene.add(sideLight);

        // 底部补光：照亮石头底部
        const bottomLight = new THREE.DirectionalLight(0x555555, 1.0);
        bottomLight.position.set(0, -5, 0);
        scene.add(bottomLight);

        // 特效扫光灯
        const flashLight = new THREE.PointLight(0xffffff, 0, 50);
        scene.add(flashLight);


        // ==================================================
        // --- 核心技术 1: 体积堆叠法 (Volumetric Stacking) ---
        // 用于正面：将线稿生成凸起的实体模型
        // ==================================================
        function createVolumetricModel(imageUrl, colorHex, layers = 20, totalDepth = 0.3) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = imageUrl;
                img.onload = () => {
                    // 像素分析：生成高对比度蒙版
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 512, 512);
                    const imageData = ctx.getImageData(0, 0, 512, 512);
                    const data = imageData.data;
                    // 假设输入是白底黑线稿
                    for (let i = 0; i < data.length; i += 4) {
                        const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                        // 如果是白色背景，设为完全透明
                        if (brightness > 150) { 
                            data[i+3] = 0; 
                        } else {
                            // 如果是黑色线条，设为完全不透明
                            data[i+3] = 255;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    
                    // 生成纹理，使用 Nearest 滤波保持边缘像切割一样锐利
                    const texture = new THREE.CanvasTexture(canvas);
                    texture.minFilter = THREE.NearestFilter; 
                    texture.magFilter = THREE.NearestFilter;

                    // 开始堆叠切片
                    const group = new THREE.Group();
                    const planeGeo = new THREE.PlaneGeometry(5.0, 5.0);
                    const layerSpacing = totalDepth / layers;
                    const material = new THREE.MeshStandardMaterial({
                        map: texture,
                        transparent: true,
                        color: new THREE.Color(colorHex),
                        alphaTest: 0.5, // 关键：丢弃半透明像素，形成硬边实体
                        roughness: 0.6,
                        metalness: 0.1,
                        side: THREE.DoubleSide // 双面渲染确保侧面有颜色
                    });

                    for (let i = 0; i < layers; i++) {
                        const layer = new THREE.Mesh(planeGeo, material);
                        // 稍微偏移每一层，形成厚度
                        layer.position.z = i * layerSpacing;
                        // 稍微缩小后面几层，形成倒角效果
                        // const scale = 1 - (i / layers) * 0.02;
                        // layer.scale.set(scale, scale, scale);
                        group.add(layer);
                    }
                    resolve(group);
                };
                img.onerror = () => resolve(null);
            });
        }

        // ==================================================
        // --- 核心技术 2: 置换贴图法 (Displacement Mapping) ---
        // 用于背面：将线稿生成凹陷的阴刻效果
        // ==================================================
        function createDisplacementModel(imageUrl) {
             return new Promise((resolve) => {
                const loader = new THREE.TextureLoader();
                loader.load(imageUrl, (texture) => {
                    // 1. 创建高密度网格平面 (以便产生精细的变形)
                    // 256x256 的细分段数
                    const geometry = new THREE.PlaneGeometry(5.0, 5.0, 256, 256);
                    
                    // 2. 设置材质，使用图片控制高度
                    const material = new THREE.MeshStandardMaterial({
                        color: 0x111111, // 深黑色凹槽
                        map: texture,    // 自身纹理
                        displacementMap: texture, // 核心：高度置换图
                        displacementScale: -0.25, // 负值表示向下凹陷
                        displacementBias: 0.12,    // 偏移量修正
                        roughness: 0.9,
                        metalness: 0.1,
                        side: THREE.FrontSide
                    });

                    const mesh = new THREE.Mesh(geometry, material);
                    // 需要旋转180度作为背面
                    mesh.rotation.y = Math.PI;
                    resolve(mesh);
                });
             });
        }


        // --- 4. 主体建模：八边形石基 ---
        // 严格尺寸：半径 2.71 对应对边距 5.0
        const r = 2.71; 
        const shape = new THREE.Shape();
        for (let i = 0; i < 8; i++) {
            const angle = (i * 45 + 22.5) * Math.PI / 180;
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
        }

        const extrudeSettings = { 
            depth: 0.5, 
            bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 2 
        };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();

        // 材质：深岩石灰
        const stoneMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333, roughness: 0.9, metalness: 0.1 
        });

        const talismanMesh = new THREE.Mesh(geometry, stoneMaterial);
        scene.add(talismanMesh);
        
        // 初始位置：背面朝外
        talismanMesh.rotation.y = Math.PI; 
        talismanMesh.rotation.x = 0.2;

        // --- 5. 执行 3D 生成与组装 ---
        
        Promise.all([
            // 正面马：生成凸起的淡紫色实体 (#dda0dd), 厚度 0.2, 30层切片
            createVolumetricModel('talisman_front.jpg', '#dda0dd', 30, 0.2),
            // 背面符文：生成凹陷的黑色阴刻
            createDisplacementModel('talisman_back.jpg')
        ]).then(models => {
            const [horseModel, runeModel] = models;

            // 5.1 安置正面 (凸起)
            if (horseModel) {
                // 放置在基座表面 (z=0.25)
                horseModel.position.z = 0.25; 
                talismanMesh.add(horseModel);
            }

            // 5.2 安置背面 (凹陷)
            if (runeModel) {
                // 放置在基座背面 (z=-0.25)
                runeModel.position.z = -0.25; 
                talismanMesh.add(runeModel);
            }

            document.getElementById('loader').style.display = 'none';
        });

        // --- 6. 动画逻辑 (保持不变) ---
        let isCasting = false;
        const audio = document.getElementById("audio");
        const hint = document.getElementById("hint");

        window.addEventListener('click', () => {
            if (isCasting) return;
            isCasting = true;
            hint.style.opacity = 0;
            audio.currentTime = 0;
            audio.play();

            talismanMesh.rotation.y = Math.PI; 
            flashLight.intensity = 0;

            // 1. 背面扫光
            flashLight.position.set(-6, 6, -4); 
            new TWEEN.Tween(flashLight).to({ intensity: 5 }, 200).start();
            new TWEEN.Tween(flashLight.position).to({ x: 6, y: -6 }, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(() => { flashLight.intensity = 0; })
                .start();

            // 2. 翻转
            new TWEEN.Tween(talismanMesh.rotation)
                .to({ y: 0 }, 2000)
                .delay(1200)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            // 3. 正面扫光
            setTimeout(() => {
                flashLight.position.set(-6, -6, 4); 
                flashLight.intensity = 0;
                new TWEEN.Tween(flashLight).to({ intensity: 8 }, 200).start();
                new TWEEN.Tween(flashLight.position).to({ x: 6, y: 6 }, 1000)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .onComplete(() => {
                        flashLight.intensity = 0;
                        setTimeout(() => {
                            isCasting = false;
                            hint.style.opacity = 1;
                        }, 500);
                    })
                    .start();
            }, 3200);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            if (!isCasting) {
                talismanMesh.position.y = Math.sin(time * 0.001) * 0.15;
            }
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
